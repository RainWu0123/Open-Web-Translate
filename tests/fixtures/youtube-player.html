<div id="movie_player" class="html5-video-player">
  <video class="video-stream html5-main-video" src="blob:https://www.youtube.com/something"></video>
  
  <!-- Primary Selector Container -->
  <div class="ytp-caption-window-container" id="ytp-caption-window-container">
    <div class="ytp-caption-window-bottom ytp-caption-window-rollup">
      <div class="ytp-caption-window-bottom" dir="ltr">
        <span class="ytp-caption-segment">Hello</span>
        <span class="ytp-caption-segment"> World</span>
      </div>
    </div>
  </div>

  <!-- Fallback Selector Container -->
  <div class="caption-window" id="fallback-caption-window" style="display: none;">
    <div class="caption-visual-line">
      <span>Fallback Text</span>
    </div>
  </div>
</div>
