name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PNPM_VERSION: 9.15.0

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_TAG}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package.json (${EXPECTED_TAG})"
            exit 1
          }
      - name: Verify
        run: |
          pnpm typecheck
          pnpm test
      - name: Package Chrome, Firefox, and reviewer source
        run: |
          pnpm zip:chrome
          pnpm zip:firefox
          git archive --format=zip --output=".output/open-web-translate-${GITHUB_REF_NAME}-source.zip" "${GITHUB_SHA}"
          (cd .output && sha256sum *.zip > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" .output/*.zip .output/SHA256SUMS.txt --verify-tag --generate-notes
