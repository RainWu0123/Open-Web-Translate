name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PNPM_VERSION: 9.15.0

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: |
          pnpm typecheck
          pnpm test
      - name: Package Chrome and Firefox
        run: |
          pnpm zip:chrome
          pnpm zip:firefox
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" .output/*.zip --verify-tag --generate-notes
